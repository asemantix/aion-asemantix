<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AION ASEMANTIX™ — 7 Divisions • Brevets</title>
  <meta name="description" content="AION ASEMANTIX™ — Portfolio brevets structuré en 7 divisions." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050608;
      --bg2:#090a10;
      --panel:rgba(255,255,255,.03);
      --panel2:rgba(255,255,255,.05);
      --text:#e9e9ee;
      --muted:#a1a1ab;

      --gold:#c9a962;
      --gold2:#f0d58a;
      --line:rgba(201,169,98,.25);
      --shadow:rgba(0,0,0,.65);

      /* accents par division (optionnels) */
      --core:#f0d58a;
      --fortress:#ef4444;
      --mesh:#eab308;
      --privacy:#00d4ff;
      --quantum:#a855f7;
      --tactical:#22c55e;
      --time:#00ffaa;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:
        radial-gradient(1000px 500px at 50% 0%, rgba(201,169,98,.12), transparent 60%),
        radial-gradient(900px 500px at 15% 35%, rgba(240,213,138,.06), transparent 65%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color:var(--text);
      line-height:1.7;
      min-height:100vh;
    }
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1180px;margin:0 auto;padding:0 22px}

    /* NAV */
    .nav{
      position:fixed; inset:0 0 auto 0; z-index:50;
      background:rgba(5,6,8,.72);
      backdrop-filter: blur(14px);
      border-bottom:1px solid transparent;
    }
    .nav.scrolled{border-bottom:1px solid var(--line)}
    .nav-inner{
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 0; gap:14px;
    }
    .brand{
      display:flex; align-items:baseline; gap:10px;
      letter-spacing:.22em; text-transform:uppercase;
      font-family:"Cormorant Garamond", serif;
      font-weight:600;
      white-space:nowrap;
    }
    .brand small{
      font-family:Inter, sans-serif;
      letter-spacing:.16em;
      color:var(--muted);
      font-weight:500;
      font-size:12px;
      text-transform:uppercase;
    }
    .menu{
      display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end;
      font-size:13px;
    }
    .menu a{
      color:var(--muted);
      padding:10px 10px;
      border:1px solid transparent;
      border-radius:14px;
      letter-spacing:.06em;
    }
    .menu a:hover{
      color:var(--text);
      border-color:rgba(201,169,98,.22);
      background:rgba(255,255,255,.02);
    }

    /* HERO */
    .hero{
      padding:110px 0 26px;
      text-align:center;
    }
    .logo{
      width:min(520px, 92vw);
      height:auto;
      filter: drop-shadow(0 18px 70px rgba(201,169,98,.18));
      opacity:.98;
    }
    .kicker{
      margin:16px 0 10px;
      font-family:"JetBrains Mono", monospace;
      font-size:12px;
      letter-spacing:.20em;
      color:var(--gold);
      display:inline-block;
      padding:8px 12px;
      border:1px solid rgba(201,169,98,.28);
      background:rgba(255,255,255,.02);
    }
    .hero h1{
      font-family:"Cormorant Garamond", serif;
      font-weight:500;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-size:clamp(30px, 4vw, 54px);
      margin:14px 0 8px;
    }
    .hero p{
      max-width:900px;
      margin:0 auto;
      color:var(--muted);
      font-weight:300;
      font-size:clamp(14px, 1.2vw, 18px);
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:12px;
      max-width:760px;
      margin:26px auto 0;
    }
    .stat{
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px 12px;
      background:rgba(255,255,255,.02);
    }
    .stat .n{
      font-family:"Cormorant Garamond", serif;
      color:var(--gold2);
      font-size:34px;
      line-height:1.1;
    }
    .stat .l{
      font-family:"JetBrains Mono", monospace;
      font-size:11px;
      color:var(--muted);
      letter-spacing:.18em;
      text-transform:uppercase;
      margin-top:6px;
    }

    /* SECTION */
    section{padding:28px 0}
    .section-head{
      display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
      margin-bottom:14px;
    }
    .section-title{
      font-family:"JetBrains Mono", monospace;
      font-size:12px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--gold2);
    }
    .section-desc{color:var(--muted);font-size:14px;max-width:820px}
    .divider{
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(201,169,98,.25), transparent);
      margin:10px 0 0;
    }

    /* TOOLBAR */
    .toolbar{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin-top:16px;
    }
    .search{
      flex:1; min-width:220px;
      display:flex;
      border:1px solid rgba(201,169,98,.22);
      border-radius:16px;
      overflow:hidden;
      background:rgba(0,0,0,.25);
    }
    .search input{
      width:100%;
      padding:12px 12px;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:14px;
    }
    .chipbar{display:flex; gap:8px; flex-wrap:wrap}
    .filterchip{
      font-family:"JetBrains Mono", monospace;
      font-size:11px;
      letter-spacing:.10em;
      text-transform:uppercase;
      padding:9px 10px;
      border-radius:999px;
      border:1px solid rgba(201,169,98,.22);
      color:var(--muted);
      background:rgba(255,255,255,.02);
      cursor:pointer;
      user-select:none;
    }
    .filterchip.active{
      border-color:rgba(201,169,98,.55);
      color:var(--text);
      background:linear-gradient(180deg, rgba(201,169,98,.18), rgba(255,255,255,.02));
    }

    /* GRID divisions */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(290px, 1fr));
      gap:14px;
      margin-top:14px;
    }
    .card{
      border:1px solid rgba(201,169,98,.18);
      border-radius:18px;
      padding:16px;
      background:var(--panel);
      box-shadow:0 22px 80px var(--shadow);
      transition:transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .card:hover{
      transform:translateY(-2px);
      border-color:rgba(201,169,98,.55);
      background:var(--panel2);
    }

    .cardhead{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      margin-bottom:10px;
    }
    .name{
      font-family:"Cormorant Garamond", serif;
      font-size:22px;
      letter-spacing:.06em;
    }
    .count{
      font-family:"JetBrains Mono", monospace;
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--gold);
      border:1px solid rgba(201,169,98,.35);
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.02);
      white-space:nowrap;
    }
    .desc{color:var(--muted);font-size:14px;margin-bottom:10px}

    .patents{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .pch{
      font-family:"JetBrains Mono", monospace;
      font-size:11px;
      letter-spacing:.08em;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.20);
      color:var(--text);
      cursor:pointer;
      transition:all .15s ease;
    }
    .pch:hover{
      border-color:rgba(201,169,98,.55);
      background:rgba(201,169,98,.10);
    }

    /* accent par division */
    .accent{height:2px; width:42px; border-radius:999px; background:rgba(201,169,98,.5); margin-bottom:6px}
    .core .accent{background:var(--core)}
    .fortress .accent{background:var(--fortress)}
    .mesh .accent{background:var(--mesh)}
    .privacy .accent{background:var(--privacy)}
    .quantum .accent{background:var(--quantum)}
    .tactical .accent{background:var(--tactical)}
    .time .accent{background:var(--time)}

    /* MODAL */
    .modal{
      position:fixed; inset:0;
      display:none;
      place-items:center;
      background:rgba(0,0,0,.78);
      z-index:100;
      padding:18px;
    }
    .modal.on{display:grid}
    .modalbox{
      width:min(920px, 98vw);
      border-radius:22px;
      border:1px solid rgba(201,169,98,.25);
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.25));
      box-shadow:0 30px 120px rgba(0,0,0,.75);
      overflow:hidden;
    }
    .mhead{
      padding:22px 22px 14px;
      border-bottom:1px solid rgba(201,169,98,.18);
      display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
    }
    .mref{
      font-family:"JetBrains Mono", monospace;
      font-size:12px;
      color:var(--gold2);
      letter-spacing:.12em;
      margin-bottom:6px;
    }
    .mtitle{
      font-family:"Cormorant Garamond", serif;
      font-size:30px;
      letter-spacing:.06em;
    }
    .msub{color:var(--muted); font-size:14px; margin-top:6px}
    .close{
      border:1px solid rgba(201,169,98,.25);
      background:rgba(255,255,255,.02);
      color:var(--text);
      border-radius:14px;
      padding:10px 12px;
      cursor:pointer;
      font-family:"JetBrains Mono", monospace;
      font-size:12px;
    }
    .close:hover{border-color:rgba(201,169,98,.55)}
    .mbody{
      padding:18px 22px 22px;
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:14px;
    }
    .panel{
      border:1px solid rgba(255,255,255,.08);
      background:rgba(0,0,0,.20);
      border-radius:18px;
      padding:14px;
    }
    .ptitle{
      font-family:"JetBrains Mono", monospace;
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--gold);
      margin-bottom:10px;
    }
    .plist{margin:0; padding-left:18px; color:var(--muted); font-size:14px; line-height:1.6}
    .tagline{display:flex; flex-wrap:wrap; gap:8px}
    .tag{
      font-family:"JetBrains Mono", monospace;
      font-size:11px;
      color:var(--muted);
      border:1px solid rgba(201,169,98,.18);
      padding:7px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.02);
    }
    @media (max-width: 820px){
      .stats{grid-template-columns:1fr; max-width:520px}
      .mbody{grid-template-columns:1fr}
      .menu{display:none}
      .nav-inner{justify-content:space-between}
    }

    footer{
      padding:34px 0;
      border-top:1px solid rgba(201,169,98,.18);
      color:var(--muted);
      text-align:center;
      margin-top:16px;
      font-size:13px;
    }
  </style>
</head>

<body>
  <header class="nav" id="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="brand">
        <span style="color:var(--gold);">AION</span>
        <span style="opacity:.7;">ASEMANTIX™</span>
        <small>7 divisions • brevets</small>
      </a>
      <nav class="menu" aria-label="Navigation">
        <a href="#divisions">Divisions</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="top" class="wrap hero">
    <img class="logo" src="assets/img/AION-LOGO.png" alt="Logo AION figuratif">
