<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ordinateur Liquide - Figure</title>
    <style>
        body {
            background: #08080a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .container {
            text-align: center;
        }
        h1 {
            color: #c9a962;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }
        .subtitle {
            color: #606060;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ORDINATEUR LIQUIDE</h1>
        <p class="subtitle">FR2600576 — Système informatique à état distribué</p>
        
        <svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradient pour le flux liquide -->
                <linearGradient id="liquidFlow" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8"/>
                    <stop offset="50%" style="stop-color:#a855f7;stop-opacity:0.9"/>
                    <stop offset="100%" style="stop-color:#00ffaa;stop-opacity:0.8"/>
                </linearGradient>
                
                <!-- Gradient doré -->
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#e0c88a"/>
                    <stop offset="100%" style="stop-color:#8a7340"/>
                </linearGradient>
                
                <!-- Glow effect -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                
                <!-- Pattern pour le réseau P2P -->
                <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                    <circle cx="10" cy="10" r="1" fill="#00d4ff" opacity="0.3"/>
                </pattern>
            </defs>
            
            <!-- Background -->
            <rect width="800" height="600" fill="#08080a"/>
            
            <!-- Réseau P2P (fond) -->
            <ellipse cx="400" cy="150" rx="280" ry="80" fill="url(#dots)" opacity="0.5"/>
            <text x="400" y="155" fill="#00d4ff" font-size="14" text-anchor="middle" font-family="monospace">RÉSEAU P2P DISTRIBUÉ</text>
            
            <!-- Fragments chiffrés dans le cloud -->
            <g opacity="0.7">
                <rect x="180" y="100" width="30" height="20" rx="3" fill="none" stroke="#00d4ff" stroke-width="1"/>
                <rect x="250" y="120" width="30" height="20" rx="3" fill="none" stroke="#a855f7" stroke-width="1"/>
                <rect x="320" y="90" width="30" height="20" rx="3" fill="none" stroke="#00ffaa" stroke-width="1"/>
                <rect x="450" y="95" width="30" height="20" rx="3" fill="none" stroke="#00d4ff" stroke-width="1"/>
                <rect x="520" y="115" width="30" height="20" rx="3" fill="none" stroke="#a855f7" stroke-width="1"/>
                <rect x="590" y="100" width="30" height="20" rx="3" fill="none" stroke="#00ffaa" stroke-width="1"/>
            </g>
            
            <!-- === DISPOSITIF PORTABLE (10) - Centre === -->
            <g transform="translate(400, 380)">
                <!-- Cercle extérieur -->
                <circle cx="0" cy="0" r="70" fill="#08080a" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
                
                <!-- Symbole clé au centre -->
                <path d="M-15,-25 L15,-25 L15,-15 L5,-15 L5,5 L15,5 L15,15 L5,15 L5,25 L-5,25 L-5,-15 L-15,-15 Z" 
                      fill="url(#goldGrad)" opacity="0.9"/>
                
                <!-- Anneau τ -->
                <circle cx="0" cy="0" r="55" fill="none" stroke="#00ffaa" stroke-width="1" stroke-dasharray="5,3"/>
                
                <!-- Labels -->
                <text x="0" y="42" fill="#c9a962" font-size="11" text-anchor="middle" font-family="monospace" font-weight="bold">TOKEN TUTE</text>
                <text x="0" y="54" fill="#c9a962" font-size="9" text-anchor="middle" font-family="monospace">Dispositif portable (10)</text>
                
                <!-- τ indicator -->
                <text x="45" y="-35" fill="#00ffaa" font-size="12" font-family="monospace">τ=E/P</text>
            </g>
            
            <!-- === DISPOSITIFS HÔTES (50) === -->
            
            <!-- Laptop gauche -->
            <g transform="translate(120, 420)">
                <rect x="-50" y="-30" width="100" height="60" rx="5" fill="#1a1a1a" stroke="#606060" stroke-width="2"/>
                <rect x="-40" y="-22" width="80" height="45" rx="2" fill="#08080a" stroke="#404040" stroke-width="1"/>
                <rect x="-55" y="32" width="110" height="8" rx="2" fill="#1a1a1a" stroke="#606060" stroke-width="1"/>
                <text x="0" y="55" fill="#606060" font-size="9" text-anchor="middle" font-family="monospace">LAPTOP</text>
                <text x="0" y="65" fill="#404040" font-size="8" text-anchor="middle">Hôte (50)</text>
                
                <!-- Écran actif -->
                <rect x="-35" y="-18" width="70" height="38" fill="#0a1520" opacity="0.8"/>
                <text x="0" y="0" fill="#00d4ff" font-size="8" text-anchor="middle" font-family="monospace">SESSION</text>
                <text x="0" y="10" fill="#00d4ff" font-size="8" text-anchor="middle" font-family="monospace">ACTIVE</text>
            </g>
            
            <!-- Tablette droite -->
            <g transform="translate(680, 420)">
                <rect x="-40" y="-50" width="80" height="100" rx="5" fill="#1a1a1a" stroke="#606060" stroke-width="2"/>
                <rect x="-32" y="-42" width="64" height="80" rx="2" fill="#08080a" stroke="#404040" stroke-width="1"/>
                <circle cx="0" cy="43" r="4" fill="none" stroke="#404040" stroke-width="1"/>
                <text x="0" y="65" fill="#606060" font-size="9" text-anchor="middle" font-family="monospace">TABLETTE</text>
                <text x="0" y="75" fill="#404040" font-size="8" text-anchor="middle">Hôte (50)</text>
            </g>
            
            <!-- Smartphone bas -->
            <g transform="translate(400, 540)">
                <rect x="-25" y="-40" width="50" height="80" rx="5" fill="#1a1a1a" stroke="#606060" stroke-width="2"/>
                <rect x="-20" y="-34" width="40" height="62" rx="2" fill="#08080a" stroke="#404040" stroke-width="1"/>
                <circle cx="0" cy="33" r="3" fill="none" stroke="#404040" stroke-width="1"/>
                <text x="0" y="55" fill="#606060" font-size="9" text-anchor="middle" font-family="monospace">PHONE</text>
            </g>
            
            <!-- Lunettes intelligentes en haut à droite -->
            <g transform="translate(680, 280)">
                <ellipse cx="-20" cy="0" rx="18" ry="12" fill="none" stroke="#606060" stroke-width="2"/>
                <ellipse cx="20" cy="0" rx="18" ry="12" fill="none" stroke="#606060" stroke-width="2"/>
                <path d="M-38,0 L-50,-5" stroke="#606060" stroke-width="2"/>
                <path d="M38,0 L50,-5" stroke="#606060" stroke-width="2"/>
                <line x1="-2" y1="0" x2="2" y2="0" stroke="#606060" stroke-width="2"/>
                <text x="0" y="25" fill="#606060" font-size="9" text-anchor="middle" font-family="monospace">LUNETTES AR</text>
                <text x="0" y="35" fill="#404040" font-size="8" text-anchor="middle">Hôte (50)</text>
            </g>
            
            <!-- === FLUX LIQUIDES === -->
            
            <!-- Du cloud vers le dispositif portable -->
            <path d="M300,170 Q350,250 380,310" fill="none" stroke="url(#liquidFlow)" stroke-width="3" stroke-dasharray="8,4" opacity="0.8">
                <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
            </path>
            <path d="M500,170 Q450,250 420,310" fill="none" stroke="url(#liquidFlow)" stroke-width="3" stroke-dasharray="8,4" opacity="0.8">
                <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
            </path>
            
            <!-- Du dispositif portable vers les hôtes -->
            <path d="M340,400 Q250,410 180,420" fill="none" stroke="url(#liquidFlow)" stroke-width="3" stroke-dasharray="8,4" opacity="0.7">
                <animate attributeName="stroke-dashoffset" from="0" to="24" dur="1.5s" repeatCount="indefinite"/>
            </path>
            <path d="M460,400 Q550,410 620,420" fill="none" stroke="url(#liquidFlow)" stroke-width="3" stroke-dasharray="8,4" opacity="0.7">
                <animate attributeName="stroke-dashoffset" from="0" to="24" dur="1.5s" repeatCount="indefinite"/>
            </path>
            <path d="M400,450 Q400,480 400,500" fill="none" stroke="url(#liquidFlow)" stroke-width="3" stroke-dasharray="8,4" opacity="0.7">
                <animate attributeName="stroke-dashoffset" from="0" to="24" dur="1.5s" repeatCount="indefinite"/>
            </path>
            <path d="M460,360 Q550,320 620,290" fill="none" stroke="url(#liquidFlow)" stroke-width="2" stroke-dasharray="6,4" opacity="0.5">
                <animate attributeName="stroke-dashoffset" from="0" to="20" dur="1.5s" repeatCount="indefinite"/>
            </path>
            
            <!-- === LABELS MODULES === -->
            
            <!-- Module stockage distribué (20) -->
            <g transform="translate(150, 150)">
                <rect x="-60" y="-20" width="120" height="40" rx="5" fill="#08080a" stroke="#00d4ff" stroke-width="1"/>
                <text x="0" y="-3" fill="#00d4ff" font-size="10" text-anchor="middle" font-family="monospace">MODULE STOCKAGE</text>
                <text x="0" y="10" fill="#00d4ff" font-size="10" text-anchor="middle" font-family="monospace">DISTRIBUÉ (20)</text>
            </g>
            
            <!-- Module réseau (30) -->
            <g transform="translate(650, 150)">
                <rect x="-50" y="-20" width="100" height="40" rx="5" fill="#08080a" stroke="#a855f7" stroke-width="1"/>
                <text x="0" y="-3" fill="#a855f7" font-size="10" text-anchor="middle" font-family="monospace">MODULE RÉSEAU</text>
                <text x="0" y="10" fill="#a855f7" font-size="10" text-anchor="middle" font-family="monospace">(30)</text>
            </g>
            
            <!-- Module exécution (40) -->
            <g transform="translate(120, 320)">
                <rect x="-55" y="-15" width="110" height="30" rx="5" fill="#08080a" stroke="#22c55e" stroke-width="1"/>
                <text x="0" y="5" fill="#22c55e" font-size="10" text-anchor="middle" font-family="monospace">MODULE EXEC (40)</text>
            </g>
            
            <!-- === LÉGENDE === -->
            <g transform="translate(50, 550)">
                <text x="0" y="0" fill="#c9a962" font-size="11" font-family="monospace" font-weight="bold">PRINCIPE:</text>
                <text x="0" y="18" fill="#a0a0a0" font-size="10">Votre environnement "coule" d'un appareil à l'autre</text>
                <text x="0" y="32" fill="#a0a0a0" font-size="10">Sans jamais laisser de trace. Post-quantique.</text>
            </g>
            
            <!-- Indicateurs de sécurité -->
            <g transform="translate(550, 550)">
                <circle cx="0" cy="5" r="4" fill="#22c55e"/>
                <text x="10" y="8" fill="#22c55e" font-size="9">RAM only - aucune trace</text>
                <circle cx="0" cy="22" r="4" fill="#a855f7"/>
                <text x="10" y="25" fill="#a855f7" font-size="9">Identités éphémères</text>
                <circle cx="0" cy="39" r="4" fill="#00d4ff"/>
                <text x="10" y="42" fill="#00d4ff" font-size="9">Fragments indistinguables du bruit</text>
            </g>
            
        </svg>
    </div>
</body>
</html>
